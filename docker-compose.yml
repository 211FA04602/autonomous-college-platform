name: acplatform-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acplatform}
      POSTGRES_USER: ${POSTGRES_USER:-acplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acplatform_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - acplatform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acplatform} -d ${POSTGRES_DB:-acplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acplatform_postgres_data:
