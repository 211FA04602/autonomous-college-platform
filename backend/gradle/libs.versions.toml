[versions]
# Java toolchain used to compile and run every module.
java = "21"

# Spring Boot: pinned to the newest available 3.x release (3.x is EOL upstream;
# this is a deliberate, documented product decision — see ADR-001 addendum and
# docs/engineering/CONSTITUTION.md "Known, documented deviation". Do not bump
# to 4.x without a dedicated migration ADR.
springBoot = "3.5.16"
# io.spring.dependency-management plugin: imports the Spring Boot BOM into
# plain library modules that do not apply the org.springframework.boot plugin.
springDependencyManagement = "1.1.7"

# UUIDv7 (time-ordered epoch) generator used by platform-core's IdGenerator.
uuidCreator = "6.1.1"

# springdoc-openapi 2.x line is the one compatible with Spring Boot 3.5.x
# (springdoc 3.x targets Spring Boot 4.x). verify/bump before production.
springdoc = "2.8.6"

# ArchUnit — module-boundary tests in app/src/test.
archunit = "1.3.2"

# Testcontainers — integrationTest source set only, never the default build.
# verify/bump before production (1.21.x is available but the foundation spec
# asked for the ~1.20.x line explicitly).
testcontainers = "1.20.6"

# Spotless + Google Java Format for formatting/static analysis gate.
spotless = "7.0.4"
googleJavaFormat = "1.25.2"

[libraries]
uuidCreator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }
springdocOpenapiWebmvcUi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunitJunit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainersPostgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainersJunitJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
