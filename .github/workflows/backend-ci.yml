name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# No AWS credentials required — this workflow only compiles/tests the backend.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile
        working-directory: backend
        run: ./gradlew build -x test

      - name: Unit + ArchUnit tests
        working-directory: backend
        run: ./gradlew test

      - name: Formatting check
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/**
          if-no-files-found: ignore

  # NOTE: Testcontainers-based integration tests (`./gradlew integrationTest`)
  # require Docker and a real PostgreSQL image pull. GitHub-hosted ubuntu
  # runners have Docker available, so this CAN run in CI even though it could
  # not be executed in the local sandbox this repo was scaffolded in. It is
  # kept as a separate, allowed-to-be-added-later job rather than assumed
  # working — enable once the backend module actually has integration tests
  # to run against a live Postgres.
