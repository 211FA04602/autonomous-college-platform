name: mobile-ci

on:
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  js-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint
        run: npm run mobile:lint

      - name: Typecheck
        run: npm run mobile:typecheck

      - name: Unit / component tests (Jest + React Native Testing Library)
        run: npm run mobile:test

  android-build-smoke:
    runs-on: ubuntu-latest
    needs: js-checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Assemble debug APK (build validation)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Android unit tests (smoke)
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      # NOTE: this job runs on a GitHub-hosted ubuntu runner that DOES have an
      # Android SDK available via android-actions/setup-android — it was not
      # possible to execute this locally in the sandbox this repo was
      # scaffolded in (no ANDROID_HOME/SDK there). Do not treat local
      # non-execution as this job being unverified — this workflow is the
      # actual gate and runs for real on every PR/push touching mobile/**.

  ios-build-test:
    runs-on: macos-latest
    needs: js-checks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build for iOS Simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace AcplatformMobile.xcworkspace \
            -scheme AcplatformMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Real iOS build/test execution requires exactly this: a macOS runner
      # with Xcode, which GitHub-hosted `macos-latest` provides. This job is
      # the actual validation gate; it genuinely runs here even though it
      # could not be executed on the Windows sandbox this repo was
      # scaffolded in. Never report iOS as "validated" from anywhere other
      # than this job's actual run result.
