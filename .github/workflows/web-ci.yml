name: web-ci

on:
  pull_request:
    paths:
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint
        run: npm run web:lint

      - name: Typecheck
        run: npm run web:typecheck

      - name: Unit / component tests
        run: npm run web:test

      - name: Production build
        run: npm run web:build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e (web only — backend not started in this job)
        working-directory: frontend
        run: npx playwright test
        continue-on-error: true
        # continue-on-error: this job exercises the web app without the backend
        # running, so it can only assert a degraded/error state, not the full
        # healthy path. It is not a substitute for full-stack e2e once a
        # backend-in-CI job exists; remove continue-on-error once that's true.
